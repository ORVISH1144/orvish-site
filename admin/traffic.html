<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>ORVISH – Live traffic</title><link rel="icon" href="/images/favicon-192.png">
<style>
:root{--bg:#fff7e2;--ink:#220713;--maroon:#761941;--gold:#ffe9af;--line:#2207131f;--card:#ffffffb8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--maroon);color:var(--gold);padding:14px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.04em}header a{color:var(--gold);font-size:13px}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
button,select{font:inherit;border:1px solid var(--maroon);background:#fff;color:var(--maroon);border-radius:8px;padding:8px 14px;cursor:pointer}
button.p{background:var(--maroon);color:var(--gold)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.bar .sp{flex:1}
.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:8px 0 0 8px;margin:0}.seg button:last-child{border-radius:0 8px 8px 0}.seg button.on{background:var(--maroon);color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.kpi small{display:block;font-size:12px;opacity:.7}.kpi b{font-size:30px;line-height:1.2;font-weight:650;color:var(--maroon)}
.kpi.live{background:var(--maroon)}.kpi.live small,.kpi.live b{color:var(--gold);opacity:1}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#35d07f;margin-right:6px;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.25}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}.card.full{grid-column:1/-1}
.card h2{font-size:14px;margin:0 0 12px;letter-spacing:.04em;text-transform:uppercase;color:var(--maroon)}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 44px;gap:10px;align-items:center;padding:5px 0;font-size:13px}.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row i{display:block;height:9px;border-radius:9px;background:#22071314;overflow:hidden}.row i b{display:block;height:100%;background:var(--maroon);border-radius:9px}.row em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px}.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;height:100%}
.chart u{display:block;width:100%;background:var(--maroon);border-radius:4px 4px 0 0;min-height:2px;text-decoration:none}.chart s{font-size:10px;opacity:.65;text-decoration:none;white-space:nowrap}.chart div:hover u{background:#a8325f}
.feed{max-height:330px;overflow:auto}.feed div{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.feed div:first-child{border:0}.feed small{opacity:.65}
.tag{display:inline-block;border-radius:99px;padding:0 8px;font-size:11px;background:var(--gold);color:var(--maroon);margin-right:6px;font-weight:600}
.empty{opacity:.6;padding:10px 0}.own{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}.own input{width:auto;padding:0;margin:0}.login{max-width:420px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.login input{width:100%;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:8px;font:inherit}.err{color:#a11;min-height:20px;font-size:13px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi.live{grid-column:1/-1}.grid{grid-template-columns:1fr}}
header.embed span{display:none}header.embed{padding-right:230px}
</style></head><body>
<header><h1>ORVISH · Live traffic</h1><span><a href="/admin/">Store admin</a> &nbsp;·&nbsp; <a href="/" target="_blank">View site</a></span></header>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>
<script>
(function(){
if(/embed=1/.test(location.search))document.querySelector('header').classList.add('embed');
var $=function(s){return document.querySelector(s)},app=$('#app'),esc=function(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var load=function(u){return new Promise(function(ok,no){var s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})};
var auth,db,docs=[],range='today',unsub=null,titles={},timer;
try{if(localStorage.getItem('orvish_notrack')===null)localStorage.setItem('orvish_notrack','true')}catch(e){}
Promise.all([fetch('/data/site.json?v='+Date.now()).then(function(r){return r.json()}),fetch('/data/products.json?v='+Date.now()).then(function(r){return r.json()}).catch(function(){return{products:[]}})]).then(function(a){
  var c=a[0].firebase_config;(a[1].products||[]).forEach(function(p){titles[p.id]=p.title});
  if(!c||!c.apiKey){app.innerHTML='<p class="empty">Customer accounts (Firebase) are not set up yet, so traffic cannot be recorded.</p>';return}
  var b='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
  return load(b+'app-compat.js').then(function(){return load(b+'auth-compat.js')}).then(function(){return load(b+'firestore-compat.js')}).then(function(){
    firebase.initializeApp(c);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(function(u){u?start(u):login()})})
}).catch(function(){app.innerHTML='<p class="err">Could not load. Please refresh.</p>'});
function login(msg){
  if(unsub){unsub();unsub=null}
  app.innerHTML='<div class="login"><h2 style="margin-top:0">Owner sign-in</h2><p>Sign in with the owner account to see your store traffic.</p><button class="p" id="g" style="width:100%">Continue with Google</button><p style="opacity:.6">or</p><form id="f"><input name="e" type="email" placeholder="Email" required><input name="p" type="password" placeholder="Password" required><button style="width:100%">Log in with email</button></form><div class="err" id="er">'+esc(msg||'')+'</div></div>';
  $('#g').onclick=function(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(x){$('#er').textContent=x.message||'Sign-in failed'})};
  $('#f').onsubmit=function(e){e.preventDefault();auth.signInWithEmailAndPassword(e.target.e.value,e.target.p.value).catch(function(){$('#er').textContent='Wrong email or password.'})};
}
function start(u){
  app.innerHTML='<div class="bar"><div class="seg" id="seg"><button data-r="today" class="on">Today</button><button data-r="7">7 days</button><button data-r="30">30 days</button></div><span class="sp"></span><label class="own" title="When ticked, pages you open on this phone or computer are not counted as visits"><input type="checkbox" id="own"> Leave out my own visits (this device)</label><small>'+esc(u.email||u.phoneNumber||'')+'</small><button id="out">Log out</button></div><div id="dash"><p class="empty">Loading traffic…</p></div>';
  $('#out').onclick=function(){auth.signOut()};
  var ow=$('#own');try{ow.checked=localStorage.getItem('orvish_notrack')!=='false'}catch(e){}ow.onchange=function(){try{localStorage.setItem('orvish_notrack',ow.checked?'true':'false')}catch(e){}};
  $('#seg').onclick=function(e){var b=e.target.closest('button');if(!b)return;range=b.dataset.r;[].forEach.call(document.querySelectorAll('#seg button'),function(x){x.classList.toggle('on',x===b)});fetchData(u)};
  fetchData(u);clearInterval(timer);timer=setInterval(draw,30000);
}
function since(){var d=new Date();d.setHours(0,0,0,0);return range==='today'?d.getTime():d.getTime()-(Number(range)-1)*86400000}
function fetchData(u){
  if(unsub){unsub();unsub=null}
  var q=db.collection('visits').where('t','>=',since()).orderBy('t','desc').limit(10000);
  var bad=function(x){$('#dash').innerHTML=/permission/i.test(x.message||x.code||'')?'<div class="card"><h2>Not authorised</h2><p>You are signed in as <b>'+esc(u.email||u.phoneNumber||'')+'</b>, which is not listed as an owner in the Firestore rules. Add this email to the rules (the line with the owner emails), publish, and refresh.</p></div>':'<p class="err">Could not load traffic: '+esc(x.message||'')+'</p>'};
  unsub=q.onSnapshot(function(s){docs=s.docs.map(function(d){return d.data()});draw()},bad);   /* every range updates by itself as visits arrive */
}
function top(list,key,n){var m={};list.forEach(function(d){var k=key(d);if(!k)return;m[k]=m[k]||{};m[k][d.sid]=1});return Object.keys(m).map(function(k){return[k,Object.keys(m[k]).length]}).sort(function(a,b){return b[1]-a[1]}).slice(0,n||8)}
function rows(t){if(!t.length)return'<p class="empty">No data yet.</p>';var mx=t[0][1];return t.map(function(x){return'<div class="row"><span title="'+esc(x[0])+'">'+esc(x[0])+'</span><i><b style="width:'+Math.max(3,Math.round(x[1]/mx*100))+'%"></b></i><em>'+x[1]+'</em></div>'}).join('')}
function uniq(l){var m={};l.forEach(function(d){m[d.sid]=1});return Object.keys(m).length}
function dev(d){var s=String(d.sid||'');return s.indexOf('.')>0?s.split('.')[0]:s}
function devices(l){var m={};l.forEach(function(d){m[dev(d)]=(m[dev(d)]||{});m[dev(d)][d.sid]=1});var k=Object.keys(m);return{n:k.length,back:k.filter(function(x){return Object.keys(m[x]).length>1}).length}}
function label(d){return d.pid?(titles[d.pid]||d.pid):({'/':'Home','/index.html':'Home','/shop':'Shop','/track':'Track order','/account':'Account','/page':'Info page','/product':'Product'}[d.p]||d.p)}
var CC={IN:'India',AE:'United Arab Emirates',SA:'Saudi Arabia',QA:'Qatar',OM:'Oman',KW:'Kuwait',BH:'Bahrain',US:'United States',GB:'United Kingdom',SG:'Singapore',MY:'Malaysia',CA:'Canada',AU:'Australia'};
function country(d){var c=String(d.c||'');return CC[c]||c}
function place(d){return[d.city,d.r,country(d)].filter(Boolean).join(', ')}
function state(d){return d.r?[d.r,country(d)].filter(Boolean).join(', '):''}
function area(d){return d.city?[d.city,d.r].filter(Boolean).join(', '):''}
function draw(){
  var el=$('#dash');if(!el)return;var now=Date.now(),views=docs.filter(function(d){return d.ev==='view'});
  var live=uniq(docs.filter(function(d){return d.t>now-300000}));
  var dv=devices(docs);
  var k=function(l,v,c){return'<div class="kpi'+(c||'')+'"><small>'+l+'</small><b>'+v+'</b></div>'};
  var buckets=[],lab=[];
  if(range==='today'){for(var h=0;h<24;h++){buckets.push(0);lab.push(h%3===0?h+':00':'')}views.forEach(function(d){buckets[new Date(d.t).getHours()]++})}
  else{var n=Number(range),s0=since();for(var i=0;i<n;i++){buckets.push(0);var dd=new Date(s0+i*86400000);lab.push(n>10&&i%3?'':dd.getDate()+'/'+(dd.getMonth()+1))}views.forEach(function(d){var ix=Math.floor((d.t-s0)/86400000);if(ix>=0&&ix<n)buckets[ix]++})}
  var mx=Math.max.apply(null,buckets.concat([1]));
  var feed=docs.slice(0,25).map(function(d){var t=new Date(d.t),ev={view:'Viewed',cart:'Added to cart',checkout:'Started checkout',order:'Placed order'}[d.ev]||d.ev;return'<div><small>'+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+'</small><span>'+(d.ev!=='view'?'<span class="tag">'+esc(ev)+'</span>':'')+esc(d.ev==='view'?'Viewed '+label(d):label(d))+'<br><small>'+esc(place(d)||'Unknown location')+' · '+esc(d.dev||'')+(d.src||d.ref?' · from '+esc(d.src||d.ref):'')+'</small></span></div>'}).join('');
  el.innerHTML='<div class="kpis">'+k('<span class="dot"></span>Visitors right now (last 5 min)',live,' live')+k('Visits',uniq(docs))+k('Different devices',dv.n)+k('Devices that came back',dv.back)+k('Page views',views.length)+k('Added to cart',docs.filter(function(d){return d.ev==='cart'}).length)+k('Orders placed',docs.filter(function(d){return d.ev==='order'}).length)+'</div><p class="empty" style="font-size:12px;padding:0 0 10px">A visit is one browsing session. Different devices counts each phone or computer once, however many times it came back. Devices are told apart only from 12 November; before that, every visit counts as its own device.</p>'+
   '<div class="grid"><div class="card full"><h2>Page views '+(range==='today'?'by hour (today)':'by day')+'</h2><div class="chart">'+buckets.map(function(v,i){return'<div title="'+v+' views"><u style="height:'+Math.round(v/mx*100)+'%"></u><s>'+lab[i]+'</s></div>'}).join('')+'</div></div>'+
   '<div class="card"><h2>Top cities and areas (visits)</h2>'+rows(top(docs,area,12))+'<p class="empty" style="font-size:12px">The number after a city is its postal area, when known. Location comes from the visitor\'s internet connection, so on mobile data it can show a nearby larger town.</p><h2 style="margin-top:18px">Top states</h2>'+rows(top(docs,state,8))+'<h2 style="margin-top:18px">Countries</h2>'+rows(top(docs,country,5))+'</div>'+
   '<div class="card"><h2>Live activity</h2><div class="feed">'+(feed||'<p class="empty">No visits yet in this period.</p>')+'</div></div>'+
   '<div class="card"><h2>Most viewed pages and products</h2>'+rows(top(views,label,10))+'</div>'+
   '<div class="card"><h2>Where visitors come from</h2>'+rows(top(docs,function(d){return d.src||d.ref||'Direct / typed address'},8))+'<h2 style="margin-top:18px">Device</h2>'+rows(top(docs,function(d){return d.dev},2))+'</div></div>';
}
})();
</script></body></html>
