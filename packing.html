<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Packing label – ORVISH</title>
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="preload" as="image" href="/images/logo-black.png">
<style>
/* A 4 x 6 inch (100 x 150 mm) shipping label: the standard size for courier labels and thermal label printers. */
@page{size:100mm 150mm;margin:0}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#e9e1c6;font:400 10pt/1.35 Arial,Helvetica,sans-serif;color:#000}
.bar{max-width:420px;margin:0 auto;padding:14px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.bar button{font:700 13px Arial,sans-serif;padding:11px 18px;border-radius:4px;border:0;background:#092d29;color:#f1ece1;cursor:pointer}
.bar span{flex:1;color:#3b4a46}
.label{width:100mm;height:150mm;margin:0 auto 30px;background:#fff;padding:5mm;display:flex;flex-direction:column;gap:3mm;overflow:hidden;border:1px dashed #9a9077}
.brand{text-align:center;padding-bottom:2mm;border-bottom:1px solid #000}.brand img{height:9mm;width:auto;display:block;margin:0 auto 1.2mm}.brand p{margin:0;font-size:8.5pt;font-weight:700;letter-spacing:.02em}
.hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:2.5mm}
.hd .pm{font-size:9pt;font-weight:700;border:1px solid #000;padding:.6mm 2mm;letter-spacing:.04em}.hd .oid{font-size:8.5pt}.hd .oid b{display:block;font-size:12pt;letter-spacing:.02em}
.box{border:1.5px solid #000;padding:2.5mm 3mm}
.box h4{margin:0 0 1mm;font-size:7.5pt;letter-spacing:.08em;text-transform:uppercase}
.to{display:flex;gap:3mm}.to .tx{flex:1;min-width:0}.to .qr{flex:none;width:24mm;text-align:center;font-size:6.5pt;line-height:1.2}.to .qr svg{width:24mm;height:24mm;display:block}
.to .name{font-size:13pt;font-weight:700}.to .addr{font-size:11pt;line-height:1.3}.to .ph{font-size:11.5pt;font-weight:700;margin-top:1mm}.to .pin{font-size:15pt;font-weight:700;letter-spacing:.06em;margin-top:1mm}
.pay{text-align:center;font-weight:700;padding:2.5mm;border:2.5px solid #000}
.pay.cod{background:#000;color:#fff;font-size:15pt}.pay.pre{font-size:13pt}
.pay small{display:block;font-size:8pt;font-weight:400;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;font-size:9pt}td{padding:1mm 0;border-bottom:1px solid #ccc;vertical-align:top}td.q{width:12mm;font-weight:700;font-size:10.5pt}
.from{font-size:8pt;margin-top:auto;border-top:1px solid #000;padding-top:2mm}.from b{font-size:8.5pt}
.msg{max-width:420px;margin:60px auto;padding:0 16px;text-align:center;font:15px Arial,sans-serif}
@media print{body{background:#fff}.bar{display:none}.label{margin:0;border:0;page-break-after:always}}
</style></head>
<body>
<div class="bar"><span>Packing label, 4 × 6 inch (100 × 150 mm). In the print window choose your label printer, or "Save as PDF".</span><button id="pr" hidden>Print label</button></div>
<div id="out"><p class="msg">Loading the order…</p></div>
<script src="/js/qrcode.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search),id=(q.get('id')||'').trim(),ph=(q.get('ph')||'').replace(/\D/g,'').slice(-10),out=document.getElementById('out');
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function m(n){return'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
  function qr(u){try{var c=qrcode(0,'M');c.addData(u);c.make();return c.createSvgTag({cellSize:2,margin:0,scalable:true})}catch(e){return''}}
  function fail(t){out.innerHTML='<p class="msg">'+t+'</p>'}
  if(!id||ph.length!==10){fail('This label link is not complete. Open it from the order email or the admin orders page.');return}
  /* ask for the short "label" answer first: it reads only the order row, so it is quick */
  fetch('/data/site.json').then(function(r){return r.json()}).then(function(S){
    var base=S.order_webhook_url+'?order_id='+encodeURIComponent(id)+'&phone='+ph+'&_='+Date.now();
    return fetch(base+'&action=label').then(function(r){return r.json()}).then(function(d){
      if(d&&d.found&&d.label)return draw(d.label);
      /* an older script without the label answer: use the invoice */
      return fetch(base+'&action=invoice').then(function(r){return r.json()}).then(function(x){
        if(!x||!x.found||!x.invoice){fail('Order not found. Check the link.');return}
        var v=x.invoice,b=v.buyer;draw({order_id:v.order_id,date:v.date,name:b.name,phone:b.phone,address:b.address,city:b.city,state:b.state,pin:b.pin,map:b.map||'',cod:/cod|cash/i.test((v.payment||'')+' '+(v.payment_status||'')),items:v.lines.filter(function(l){return!l.delivery}).map(function(l){return{title:l.title,qty:l.qty}})})})
    })
  }).catch(function(){fail('The order could not be loaded right now. Please try again in a minute.')});
  function draw(v){
    var b=v,cod=!!v.cod,items=v.items,n=items.reduce(function(a,l){return a+Number(l.qty||0)},0);
    document.title='Label '+v.order_id;
    out.innerHTML='<div class="label">'+
      '<div class="brand"><img src="/images/logo-black.png" alt="ORVISH"><p>Find your Next Premium Perfume at Orvish.com</p></div>'+
      '<div class="hd"><div class="oid">Order<b>'+esc(v.order_id)+'</b>'+esc(v.date)+'</div><div class="pm">'+(cod?'COD':'Prepaid')+'</div></div>'+
      '<div class="box to"><div class="tx"><h4>Deliver to</h4><div class="name">'+esc(b.name)+'</div><div class="addr">'+esc(b.address)+'<br>'+esc(b.city)+(b.state?', '+esc(b.state):'')+'</div><div class="pin">PIN '+esc(b.pin)+'</div><div class="ph">☎ '+esc(b.phone)+'</div></div>'+(b.map&&window.qrcode?'<div class="qr">'+qr(b.map)+'Scan for the<br>map pin</div>':'')+'</div>'+
      '<div class="box"><h4>Pack these items ('+n+' '+(n===1?'item':'items')+')</h4><table>'+items.map(function(l){return'<tr><td class="q">'+l.qty+' ×</td><td>'+esc(l.title)+'</td></tr>'}).join('')+'</table></div>'+
      '</div>';
    var pr=document.getElementById('pr');pr.hidden=false;pr.onclick=function(){window.print()};
    if(q.get('print')==='1'){var lg=out.querySelector('.brand img'),go=function(){setTimeout(function(){window.print()},100)};if(!lg||lg.complete)go();else{lg.onload=go;lg.onerror=go}}
  }
})();
</script></body></html>
