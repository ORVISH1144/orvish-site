<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Invoice – ORVISH</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap">
<style>
:root{--green:#092d29;--gold:#b89519;--cream:#f1ece1;--line:#d9d2bd;--ink:#14211f;--mute:#5d6a66}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 13px/1.5 "DM Sans",Arial,sans-serif}
.bar{max-width:820px;margin:0 auto;padding:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar a,.bar button{font:600 13px "DM Sans",Arial,sans-serif;padding:11px 18px;border-radius:4px;border:1px solid var(--green);background:#fff;color:var(--green);text-decoration:none;cursor:pointer}
.bar button{background:var(--green);color:var(--cream)}.bar span{flex:1}
.sheet{max-width:820px;margin:0 auto 40px;background:#fff;border:1px solid var(--line);position:relative}
.top{background:var(--green);color:var(--cream);padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.top img{height:38px;width:auto;display:block}.top .nm{font:600 26px "Playfair Display",Georgia,serif;letter-spacing:.04em}
.top h1{margin:0;font:600 20px "Playfair Display",Georgia,serif;letter-spacing:.06em;text-align:right}.top small{display:block;font:400 11px "DM Sans",Arial,sans-serif;opacity:.8;letter-spacing:.02em;text-align:right}
.pad{padding:22px 28px}
.meta{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;border-bottom:1px solid var(--line)}
.meta h3,.parties h3{margin:0 0 5px;font:600 11px "DM Sans",Arial,sans-serif;color:var(--gold);letter-spacing:.04em}
.meta b{font-weight:600}.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px}.kv span{color:var(--mute)}.kv b{text-align:right;font-variant-numeric:tabular-nums}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{background:var(--cream);font:600 10.5px "DM Sans",Arial,sans-serif;text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #ece7d8;text-align:right;vertical-align:top;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:28px}th:last-child,td:last-child{padding-right:28px}
td.t{white-space:normal;text-align:left;min-width:170px}th.t{text-align:left}td small{display:block;color:var(--mute);font-size:11px}
.sum{display:grid;grid-template-columns:1fr 290px;gap:24px;align-items:start}
.sum .kv{font-size:13px}.sum .tot{border-top:2px solid var(--green);margin-top:8px;padding-top:8px;font:700 16px "DM Sans",Arial,sans-serif;display:flex;justify-content:space-between}
.words{font-size:12.5px}.words b{display:block;margin-top:2px}
.note{color:var(--mute);font-size:11.5px;border-top:1px solid var(--line)}
.stamp{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);border:4px solid #b3261e;color:#b3261e;font:700 34px "DM Sans",Arial,sans-serif;letter-spacing:.12em;padding:8px 22px;opacity:.28;pointer-events:none}
.msg{max-width:820px;margin:60px auto;padding:0 16px;text-align:center;font-size:15px}
@media(max-width:640px){.pad{padding:16px}.top{padding:16px}.meta,.parties,.sum{grid-template-columns:1fr}th:first-child,td:first-child{padding-left:16px}th:last-child,td:last-child{padding-right:16px}.top h1{font-size:17px}}
@page{size:A4;margin:10mm}
@media print{body{background:#fff}.bar{display:none}.sheet{border:0;margin:0;max-width:none}.wrap{overflow:visible}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.meta,.parties{grid-template-columns:1.2fr 1fr}.sum{grid-template-columns:1fr 290px}}
</style></head>
<body>
<div class="bar"><a href="/">Back to store</a><span></span><button id="dl" hidden>Download PDF</button></div>
<div id="out"><p class="msg">Loading your invoice…</p></div>
<script>
(function(){
  var q=new URLSearchParams(location.search),id=(q.get('id')||'').trim(),ph=(q.get('ph')||'').replace(/\D/g,'').slice(-10),out=document.getElementById('out');
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function m(n){return'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function words(n){
    var a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
    function two(x){return x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'')}
    function three(x){return(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'')}
    var r=Math.floor(n),p=Math.round((n-r)*100),s='';if(p===100){r++;p=0}
    if(r===0)s='Zero';else{var cr=Math.floor(r/1e7),la=Math.floor(r%1e7/1e5),th=Math.floor(r%1e5/1e3),re=r%1e3;s=[cr?three(cr)+' Crore':'',la?two(la)+' Lakh':'',th?two(th)+' Thousand':'',re?three(re):''].filter(Boolean).join(' ')}
    return'Rupees '+s+(p?' and '+two(p)+' Paise':'')+' Only'}
  function fail(t){out.innerHTML='<p class="msg">'+t+'</p>'}
  if(!id||ph.length!==10){fail('This invoice link is not complete. Open the invoice from your account or from your order email.');return}
  fetch('/data/site.json').then(function(r){return r.json()}).then(function(S){
    if(!S.order_webhook_url)throw 0;
    return fetch(S.order_webhook_url+'?action=invoice&order_id='+encodeURIComponent(id)+'&phone='+ph+'&_='+Date.now()).then(function(r){return r.json()}).then(function(d){
      if(!d||!d.found||!d.invoice){fail('We could not find this order. Check the link, or contact us and we will send your invoice.');return}
      draw(d.invoice,S)})
  }).catch(function(){fail('The invoice could not be loaded right now. Please try again in a minute.')});
  function draw(v,S){
    var s=v.seller,b=v.buyer,T=v.totals,intra=v.intra,gst=!!s.gstin,disc=v.lines.some(function(l){return l.discount>0});
    var rows=v.lines.map(function(l,i){
      return'<tr><td>'+(i+1)+'</td><td class="t">'+esc(l.title)+'</td><td>'+esc(l.hsn||'–')+'</td><td>'+l.qty+'</td><td>'+m(l.price)+'</td>'+(disc?'<td>'+(l.discount?m(l.discount):'–')+'</td>':'')+
        '<td>'+m(l.taxable)+'</td><td>'+l.rate+'%</td>'+(intra?'<td>'+m(l.cgst)+'</td><td>'+m(l.sgst)+'</td>':'<td>'+m(l.igst)+'</td>')+'<td><b>'+m(l.net)+'</b></td></tr>'}).join('');
    var place=b.state+(b.code?' ('+b.code+')':'');
    document.title='Invoice '+v.invoice_no+' – ORVISH';
    out.innerHTML='<div class="sheet">'+(/cancel/i.test(v.status)?'<div class="stamp">CANCELLED</div>':'')+
      '<div class="top">'+(S.logo?'<img src="'+esc(encodeURI(S.logo))+'" alt="ORVISH">':'<div class="nm">ORVISH</div>')+'<div><h1>'+(gst?'Tax invoice':'Invoice')+'</h1><small>Original for recipient</small></div></div>'+
      '<div class="pad meta"><div><h3>Sold by</h3><b>'+esc(s.name)+'</b><br>'+esc(s.address).replace(/\n/g,'<br>')+(s.address?'<br>':'')+(gst?'GSTIN: <b>'+esc(s.gstin)+'</b><br>':'')+'State: '+esc(s.state)+(s.code?' ('+esc(s.code)+')':'')+([s.phone,s.email].filter(Boolean).length?'<br>'+esc([s.phone,s.email].filter(Boolean).join(' · ')):'')+'</div>'+
      '<div class="kv"><span>Invoice no.</span><b>'+esc(v.invoice_no)+'</b><span>Invoice date</span><b>'+esc(v.date)+'</b><span>Order ID</span><b>'+esc(v.order_id)+'</b><span>Payment</span><b>'+esc(v.payment||'–')+'</b><span>Place of supply</span><b>'+esc(place)+'</b></div></div>'+
      '<div class="pad parties"><div><h3>Billed to</h3><b>'+esc(b.name)+'</b><br>'+esc(b.phone)+(b.email?'<br>'+esc(b.email):'')+'</div><div><h3>Shipped to</h3>'+esc(b.address)+'<br>'+esc([b.city,b.pin].filter(Boolean).join(' – '))+'<br>'+esc(place)+'</div></div>'+
      '<div class="wrap"><table><thead><tr><th>#</th><th class="t">Item</th><th>HSN</th><th>Qty</th><th>Price (incl. GST)</th>'+(disc?'<th>Discount</th>':'')+'<th>Taxable value</th><th>GST</th>'+(intra?'<th>CGST</th><th>SGST</th>':'<th>IGST</th>')+'<th>Amount</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="pad sum"><div class="words">Amount in words<b>'+words(T.total)+'</b></div><div><div class="kv"><span>Taxable value</span><b>'+m(T.taxable)+'</b>'+(intra?'<span>CGST</span><b>'+m(T.cgst)+'</b><span>SGST</span><b>'+m(T.sgst)+'</b>':'<span>IGST</span><b>'+m(T.igst)+'</b>')+(T.discount?'<span>Discount given</span><b>'+m(T.discount)+'</b>':'')+'<span>Delivery</span><b>'+(T.delivery?m(T.delivery)+' (in the table)':'Free')+'</b></div><div class="tot"><span>Total</span><span>'+m(T.total)+'</span></div></div></div>'+
      '<div class="pad note">All prices include GST.'+(s.note?' '+esc(s.note):'')+' This is a computer-generated invoice and needs no signature.</div></div>';
    var dl=document.getElementById('dl');dl.hidden=false;dl.onclick=function(){window.print()};
    if(q.get('print')==='1')setTimeout(function(){window.print()},600);
  }
})();
</script></body></html>
