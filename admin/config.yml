backend:
  name: github
  repo: ORVISH1144/orvish-site
  branch: main
site_url: https://www.orvish.com
media_folder: images/uploads
public_folder: /images/uploads
collections:
- name: products
  label: Products
  label_singular: Product
  icon: shopping_bag
  folder: data/products
  extension: json
  format: json
  create: true
  delete: true
  slug: '{{id}}'
  identifier_field: title
  summary: 'Shows #{{position}} – {{title}} – ₹{{price}}'
  sortable_fields:
    fields: [position, title, price]
    default: {field: position, direction: Ascending}
  fields:
  - label: ID (short, lowercase, no spaces – used in the web address)
    name: id
    widget: string
    hint: e.g. blue-water-bottle. Do not change after publishing.
  - label: Title
    name: title
    widget: string
  - label: Price (₹)
    name: price
    widget: number
    value_type: float
    min: 0
  - label: Original price (₹) – optional, shows a Sale badge
    name: compare_at_price
    widget: number
    value_type: float
    min: 0
    required: false
    default: 0
  - label: Collection
    name: collection
    widget: string
    default: all
    hint: Used for the filter on the Shop page
  - label: Photos (first one is the main photo)
    name: images
    widget: list
    field:
      label: Photo
      name: image
      widget: image
  - label: Hide this product from the store (keeps it saved, customers cannot see it)
    name: hidden
    widget: boolean
    default: false
    required: false
  - label: In stock
    name: in_stock
    widget: boolean
    default: true
  - label: Stock count (bottles available)
    name: stock
    widget: number
    value_type: int
    min: 0
    required: false
    hint: Type how many bottles you have now. Leave empty for no limit. Each order lowers it automatically and the product shows Sold out at 0. When new stock arrives, type the new total here.
  - label: HSN code (for the GST invoice)
    name: hsn
    widget: string
    required: false
    hint: The product's HSN code, for example 3303 for perfumes. It is printed on the invoice and used in the GST register.
  - label: GST rate % (the website price already includes this GST)
    name: gst_rate
    widget: number
    value_type: float
    min: 0
    max: 40
    required: false
    hint: For example 18. The invoice splits the price into taxable value and GST using this rate.
  - label: Show on home page
    name: featured
    widget: boolean
    default: true
  - label: Brand (e.g. Rasasi)
    name: brand
    widget: string
    required: false
  - label: Gender
    name: gender
    widget: select
    options:
    - label: For Him
      value: men
    - label: For Her
      value: women
    - label: Unisex
      value: unisex
    required: false
  - label: Type (e.g. Eau de Parfum)
    name: type
    widget: string
    required: false
  - label: Notes tags shown on the product card (e.g. Amber
    Woody): null
    name: notes
    widget: list
    required: false
    field:
      label: Note
      name: note
      widget: string
  - label: Show in Best Sellers
    name: best_seller
    widget: boolean
    default: false
  - label: Small badge text (optional
    e.g. New): null
    name: badge
    widget: string
    required: false
  - label: Sizes / options with their own price (optional)
    name: variants
    widget: list
    required: false
    fields:
    - label: Name (e.g. 50 ml)
      name: label
      widget: string
    - label: Price (₹)
      name: price
      widget: number
      value_type: float
    - label: Original price (₹)
      name: compare_at_price
      widget: number
      value_type: float
      required: false
    - label: In stock
      name: in_stock
      widget: boolean
      default: true
  - label: Bundle offers (e.g. Buy 2 save 10%) – optional
    name: bundles
    widget: list
    required: false
    summary: Buy {{fields.qty}} save {{fields.percent}}%
    collapsed: true
    minimize_collapsed: true
    fields:
    - label: Quantity (e.g. 2)
      name: qty
      widget: number
      value_type: int
      min: 2
    - label: Discount % (e.g. 10)
      name: percent
      widget: number
      value_type: int
      min: 1
      max: 90
  - label: Fragrance notes (top / heart / base)
    name: note_pyramid
    widget: object
    required: false
    fields:
    - label: Top notes
      name: top
      widget: string
      required: false
    - label: Heart notes
      name: heart
      widget: string
      required: false
    - label: Base notes
      name: base
      widget: string
      required: false
  - label: Short description
    name: short_description
    widget: string
    required: false
  - label: Full description
    name: description
    widget: text
  - label: Extra info sections (e.g. Shipping, Care)
    name: details
    widget: list
    required: false
    fields:
    - label: Heading
      name: title
      widget: string
    - label: Text
      name: body
      widget: text
  - label: Questions and answers for this product (shown under the reviews, before the general questions)
    name: faqs
    widget: list
    required: false
    summary: '{{fields.q}}'
    fields:
    - label: Question
      name: q
      widget: string
    - label: Answer
      name: a
      widget: text
  - label: Also show the automatic questions (authentic, smell, who it is for) made from the product details
    name: auto_faq
    widget: boolean
    default: true
    required: false
  - label: Customer reviews (add or edit reviews here – website reviews from customers arrive in the Google Sheet)
    name: reviews
    widget: list
    required: false
    summary: '{{fields.rating}}★ – {{fields.name}}'
    fields:
    - label: Customer name
      name: name
      widget: string
    - label: Photo from the customer (optional)
      name: photo
      widget: image
      required: false
    - label: Stars
      name: rating
      widget: select
      options:
      - label: 5 stars
        value: 5
      - label: 4 stars
        value: 4
      - label: 3 stars
        value: 3
      - label: 2 stars
        value: 2
      - label: 1 star
        value: 1
      default: 5
    - label: Review text
      name: review
      widget: text
    - label: Date (e.g. 2026-11-10)
      name: date
      widget: string
      required: false
    - label: Verified buyer tag
      name: verified
      widget: boolean
      default: false
      required: false
  - label: Customers also bought – choose up to 2 products to show under this product (leave empty = chosen automatically)
    name: bought_with
    widget: relation
    collection: products
    value_field: id
    search_fields:
    - title
    display_fields:
    - title
    multiple: true
    max: 2
    required: false
  - label: Hide "Customers also bought" on this product
    name: hide_bought_with
    widget: boolean
    default: false
    required: false
  - label: Display order on the website (1 = shown first, 2 = second, and so on)
    name: position
    widget: number
    value_type: int
    min: 1
    default: 100
    required: false
    hint: To swap two products, open both and swap their numbers. The product list here is sorted by this number too.
- name: home
  label: Home page
  files:
  - name: home
    label: Home page (banners, sections, which products show)
    file: data/home.json
    format: json
    fields:
    - label: Large scrolling text band on home page (leave empty to hide)
      name: marquee_text
      widget: string
      required: false
    - label: Announcement bar messages
      name: announcements
      widget: list
      required: false
      field:
        label: Message
        name: message
        widget: string
    - label: Home page slider
      name: slides
      widget: list
      required: false
      fields:
      - label: Image
        name: image
        widget: image
      - label: Caption
        name: caption
        widget: string
        required: false
      - label: Button text
        name: button_label
        widget: string
        required: false
      - label: Button link
        name: button_link
        widget: string
        required: false
    - label: Scrolling ticker
      name: ticker
      widget: list
      required: false
      fields:
      - label: Icon
        name: icon
        widget: select
        options:
        - refresh
        - shield
        - truck
        - star
      - label: Text
        name: text
        widget: string
    - label: Home page products heading
      name: home_heading
      widget: string
      required: false
    - label: How many products on home page
      name: products_on_home
      widget: number
      min: 1
      max: 24
    - label: Best sellers heading
      name: best_sellers_title
      widget: string
      required: false
    - label: Best sellers tabs (button label + collection name)
      name: home_tabs
      widget: list
      required: false
      fields:
      - label: Button label
        name: label
        widget: string
      - label: Collection name (as in the product)
        name: collection
        widget: string
    - label: Home heading – For Him row
      name: men_title
      widget: string
      required: false
    - label: Home heading – For Her row
      name: women_title
      widget: string
      required: false
    - label: Collection tiles (home page picture boxes)
      name: collection_tiles
      widget: list
      required: false
      fields:
      - label: Title
        name: title
        widget: string
      - label: Small text
        name: text
        widget: string
        required: false
      - label: Image
        name: image
        widget: image
      - label: Link
        name: url
        widget: string
      - label: Button text
        name: button
        widget: string
        required: false
    - label: Service strip (free shipping, secure payments…)
      name: services
      widget: list
      required: false
      fields:
      - label: Icon (truck
        shield: null
        lock: null
        chat: null
        refresh: null
        star): null
        name: icon
        widget: string
      - label: Title
        name: title
        widget: string
      - label: Text
        name: text
        widget: string
        required: false
    - label: Home text heading
      name: home_text_title
      widget: string
      required: false
    - label: Home text (bottom of home page)
      name: home_text
      widget: text
      required: false
    - label: Trending searches (shown when searching)
      name: trending
      widget: list
      required: false
      fields:
      - label: Label
        name: label
        widget: string
      - label: Link
        name: url
        widget: string
    - label: Questions and answers on product pages
      name: faq
      widget: list
      required: false
      fields:
      - label: Question
        name: title
        widget: string
      - label: Answer
        name: body
        widget: text
    - label: Product page badges
      name: product_badges
      widget: list
      required: false
      fields:
      - label: Icon (truck
        shield: null
        lock: null
        chat: null
        refresh: null
        star): null
        name: icon
        widget: string
      - label: Text
        name: text
        widget: string
    - label: Best Sellers – choose which products to show, in order (leave empty = products marked Best seller)
      name: best_pick
      widget: relation
      collection: products
      value_field: id
      search_fields:
      - title
      display_fields:
      - title
      multiple: true
      required: false
    - label: For Him row – choose products (leave empty = all For Him products)
      name: him_pick
      widget: relation
      collection: products
      value_field: id
      search_fields:
      - title
      display_fields:
      - title
      multiple: true
      required: false
    - label: For Her row – choose products (leave empty = all For Her products)
      name: her_pick
      widget: relation
      collection: products
      value_field: id
      search_fields:
      - title
      display_fields:
      - title
      multiple: true
      required: false
    - label: Extra product rows (e.g. New arrivals, Gift picks) – choose products for each
      name: custom_rows
      widget: list
      required: false
      summary: '{{fields.title}}'
      fields:
      - label: Row heading
        name: title
        widget: string
      - label: Products
        name: products
        widget: relation
        collection: products
        value_field: id
        search_fields:
        - title
        display_fields:
        - title
        multiple: true
        required: false
    - label: Big banner at the bottom of the home page (wide picture, e.g. 2400 x 900)
      name: bottom_banner
      widget: object
      required: false
      fields:
      - label: Banner image
        name: image
        widget: image
        required: false
      - label: Heading
        name: title
        widget: string
        required: false
      - label: Text
        name: text
        widget: string
        required: false
      - label: Button text
        name: button_label
        widget: string
        required: false
      - label: Button link
        name: button_link
        widget: string
        required: false
  icon: home
- name: deals
  label: Deals
  icon: sell
  files:
  - name: deals
    label: Deals – tags on products, Deals menu, coming and ongoing deals
    file: data/deals.json
    format: json
    fields:
    - label: Show deals on the website (switch off to hide every deal tag and the Deals menu)
      name: enabled
      widget: boolean
      default: true
    - label: Menu name
      name: menu_label
      widget: string
      default: Deals
    - label: Deals page heading
      name: page_title
      widget: string
      default: Deals
    - label: Deals
      name: deals
      widget: list
      required: false
      collapsed: true
      summary: '{{fields.name}}'
      fields:
      - label: Deal name (e.g. White Friday Deal)
        name: name
        widget: string
      - label: Tag shown on the products (leave empty to use the deal name)
        name: badge
        widget: string
        required: false
      - label: Switch this deal on
        name: enabled
        widget: boolean
        default: true
      - label: Starts on (leave empty = already started)
        name: start
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        required: false
      - label: Ends on (the whole day is included; leave empty = no end date)
        name: end
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        required: false
      - label: Show it as "Coming soon" before it starts
        name: show_upcoming
        widget: boolean
        default: true
        required: false
      - label: Price drop % while the deal is running (0 = tag only, prices stay the same)
        name: percent_off
        widget: number
        value_type: int
        min: 0
        max: 90
        default: 0
        required: false
        hint: When above 0, the product price drops by this % during the deal and the old price is shown struck out.
      - label: Include every product
        name: all_products
        widget: boolean
        default: false
        required: false
      - label: Products in this deal
        name: products
        widget: relation
        collection: products
        value_field: id
        search_fields:
        - title
        display_fields:
        - title
        multiple: true
        required: false
      - label: Short text shown on the Deals page (optional)
        name: description
        widget: string
        required: false
- name: film
  label: Brand film
  icon: movie
  files:
  - name: film
    label: Brand film – animated film on the home page, under Best Sellers
    file: data/film.json
    format: json
    fields:
    - label: Show the film on the website
      name: enabled
      widget: boolean
      default: true
    - label: Small line above the heading (optional)
      name: section_kicker
      widget: string
      required: false
    - label: Heading above the film (optional)
      name: section_title
      widget: string
      required: false
    - label: Show it on
      name: show_on
      widget: select
      default: both
      options:
      - label: Phones and computers
        value: both
      - label: Phones only
        value: phone
      - label: Computers only
        value: computer
    - label: How many times it plays (then it rests on the last frame with a Replay button)
      name: plays
      widget: number
      value_type: int
      min: 1
      max: 5
      default: 2
    - label: Scenes (switch off any you do not want; the logo end frame always shows)
      name: scenes
      widget: object
      collapsed: true
      fields:
      - {label: 1. Gold light streak, name: intro, widget: boolean, default: true}
      - {label: 2. Logo – icon unfolds in gold, turns white, then the name appears, name: logo, widget: boolean, default: true}
      - {label: 3. Phone showing the home page, name: home, widget: boolean, default: true}
      - {label: 4. Search being typed, name: search, widget: boolean, default: true}
      - {label: 5. Product cards floating around the phone, name: cards, widget: boolean, default: true}
      - {label: 6. Product page – Add to cart / Buy it now, name: product, widget: boolean, default: true}
      - {label: 7. Order placed, name: order, widget: boolean, default: true}
      - {label: 8. Delivery map, name: map, widget: boolean, default: true}
      - {label: 9. ORVISH box delivered, name: box, widget: boolean, default: true}
      - {label: 10. Headline, name: headline, widget: boolean, default: true}
      - {label: 11. Tagline and trust points, name: tagline, widget: boolean, default: true}
    - label: Logo icon (white on transparent PNG; shown big, first in gold then white)
      name: icon
      widget: image
      default: /images/film/orvish-icon.png
    - label: Gold colour of the icon before it turns white
      name: icon_color
      widget: color
      default: '#f3cf45'
    - label: Logo name / wordmark (white on transparent PNG)
      name: wordmark
      widget: image
      default: /images/film/orvish-wordmark.png
    - label: Products shown in the film (leave empty = your products in their shop order)
      name: products
      widget: relation
      collection: products
      value_field: id
      search_fields:
      - title
      display_fields:
      - title
      multiple: true
      required: false
    - label: Include out-of-stock products (shown with a label, never on the product page scene)
      name: show_out_of_stock
      widget: boolean
      default: false
    - label: Label on out-of-stock products
      name: out_of_stock_label
      widget: string
      default: Sold out
    - label: Product on the product page scene (must be in stock; empty = first in-stock best seller)
      name: hero_product
      widget: relation
      collection: products
      value_field: id
      search_fields:
      - title
      display_fields:
      - title
      required: false
    - label: Word typed in the search (empty = most common scent note in stock)
      name: search_word
      widget: string
      required: false
    - label: Delivery line under the search
      name: location_text
      widget: string
      default: Delivering across India
      required: false
    - label: Shipping text (empty = "Free shipping" when your announcement bar says free shipping)
      name: shipping_text
      widget: string
      required: false
    - label: Order placed message
      name: order_text
      widget: string
      default: Order placed, thank you!
    - label: Line under the order message
      name: order_subtext
      widget: string
      required: false
    - label: Delivery card heading
      name: track_title
      widget: string
      default: Arriving today
    - label: Delivery card line
      name: track_subtext
      widget: string
      required: false
    - label: Delivered notification – heading
      name: delivered_title
      widget: string
      default: Delivered
    - label: Delivered notification – text
      name: delivered_text
      widget: string
      required: false
    - label: Headline (the last word gets a gold underline)
      name: headline
      widget: string
      default: Every scent you love.
    - label: Tagline (empty = the store tagline in Site settings)
      name: tagline
      widget: string
      required: false
    - label: Show the trust points from the home page strip under the tagline
      name: show_trust_points
      widget: boolean
      default: true
    - label: End button text
      name: button_label
      widget: string
      default: Shop now
    - label: End button link
      name: button_link
      widget: string
      default: /shop
    - label: Where a tap on the film goes (empty = the product page scene's product)
      name: tap_link
      widget: string
      required: false
- name: nav
  label: Menu & footer
  files:
  - name: nav
    label: Menu and footer
    file: data/nav.json
    format: json
    fields:
    - label: Menu
      name: menu
      widget: list
      fields:
      - label: Label
        name: label
        widget: string
      - label: Link
        name: url
        widget: string
      - label: Drop-down items (optional)
        name: children
        widget: list
        required: false
        fields:
        - label: Label
          name: label
          widget: string
        - label: Link
          name: url
          widget: string
    - label: Footer columns
      name: footer_columns
      widget: list
      fields:
      - label: Column title
        name: title
        widget: string
      - label: Links
        name: links
        widget: list
        fields:
        - label: Label
          name: label
          widget: string
        - label: Link
          name: url
          widget: string
    - label: Footer newsletter text
      name: footer_newsletter_text
      widget: string
      required: false
  icon: menu
- name: commerce
  label: Payments, shipping & discounts
  files:
  - name: commerce
    label: Payments, shipping and discount codes
    file: data/commerce.json
    format: json
    fields:
    - label: Discount codes
      name: discount_codes
      widget: list
      required: false
      collapsed: true
      minimize_collapsed: true
      summary: '{{fields.code}}'
      fields:
      - label: Code
        name: code
        widget: string
      - label: Percent off
        name: percent
        widget: number
      - label: Minimum items in cart
        name: min_items
        widget: number
        default: 1
      - label: How many times one customer can use this coupon (leave empty or 0 for no limit)
        name: max_uses
        widget: number
        value_type: int
        min: 0
        required: false
        hint: 1 = once per customer, 2 = twice. Checked against the customer's phone number and email in your order sheet.
      - label: Can be used together with bundle prices (Buy 2, Buy 3)
        name: stack_with_bundles
        widget: boolean
        default: true
        required: false
        hint: Switch off for big coupons, so a customer cannot add them on top of a bundle price.
      - label: Maximum discount in ₹ (leave empty or 0 for no limit)
        name: max_discount
        widget: number
        value_type: int
        min: 0
        required: false
        hint: Example – 10% off with a maximum of 200 means the customer never gets more than ₹200 off.
      - label: Fixed amount off in ₹ (optional – when filled, this is used instead of the percentage)
        name: amount
        widget: number
        required: false
      - label: Hide this code from the coupon lists on the website (it still works when typed – used for reminder emails)
        name: hidden
        widget: boolean
        default: false
        required: false
    - label: Referral codes (a customer shares a code – the friend gets money off the first order, the customer gets the same after it is delivered)
      name: referral
      widget: object
      collapsed: true
      fields:
      - {label: Switch referral codes on, name: enabled, widget: boolean, default: true, required: false}
      - {label: Amount off for each of them (₹), name: amount, widget: number, value_type: int, default: 100}
    - label: GST and invoice details (printed on every invoice and used in the GST register)
      name: gst
      widget: object
      collapsed: true
      fields:
      - {label: Link of your GST Google Sheet, name: sheet_url, widget: string, required: false, hint: "Upload ORVISH-GST-Register.xlsx to Google Drive, choose File > Save as Google Sheets, then paste that sheet's link here. Sales and returns are written into it."}
      - {label: GSTIN (your GST number), name: gstin, widget: string, required: false}
      - {label: Legal business name (as on the GST certificate), name: legal_name, widget: string, required: false}
      - {label: Registered address, name: address, widget: text, required: false}
      - {label: State of registration, name: state, widget: string, default: Kerala, required: false, hint: "Orders delivered inside this state get CGST + SGST. Other states get IGST."}
      - {label: Phone shown on the invoice, name: phone, widget: string, required: false}
      - {label: Email shown on the invoice, name: email, widget: string, required: false}
      - {label: Invoice number prefix, name: invoice_prefix, widget: string, default: ORV, required: false, hint: "Invoice numbers look like ORV/26-27/0001 and count up by themselves."}
      - {label: HSN code used when a product has none, name: default_hsn, widget: string, required: false}
      - {label: GST rate % used when a product has none, name: default_rate, widget: number, value_type: float, required: false}
      - {label: HSN / SAC code for a delivery charge, name: shipping_hsn, widget: string, default: '996812', required: false}
      - {label: Note printed at the bottom of the invoice, name: invoice_note, widget: text, required: false}
    - label: Supplier (the orders page gets a button that sends an order to this WhatsApp number to pack and ship)
      name: supplier
      widget: object
      collapsed: true
      fields:
      - {label: Supplier name, name: name, widget: string, required: false}
      - {label: Supplier WhatsApp number with country code (digits only), name: whatsapp, widget: string, required: false, hint: "For example 919876543210"}
    - label: Show "Only N left" on the product page when stock is at or below this number
      name: low_stock
      widget: number
      value_type: int
      default: 5
      required: false
    - label: Shiprocket parcel details (used when you press Ship with Shiprocket on the orders page)
      name: shiprocket
      widget: object
      collapsed: true
      fields:
      - {label: 'Pickup location name, exactly as in Shiprocket (Settings > Pickup Addresses)', name: pickup_location, widget: string, default: Primary}
      - {label: Parcel weight in kg, name: weight_kg, widget: number, value_type: float, default: 0.4}
      - {label: Parcel length in cm, name: length_cm, widget: number, default: 15}
      - {label: Parcel breadth in cm, name: breadth_cm, widget: number, default: 10}
      - {label: Parcel height in cm, name: height_cm, widget: number, default: 8}
      - {label: Send every new order to Shiprocket automatically, name: auto_create, widget: boolean, default: false, required: false, hint: 'Each new website order appears in Shiprocket by itself. Orders whose payment needs checking are never sent automatically.'}
      - label: What to do in Shiprocket automatically
        name: auto_mode
        widget: select
        default: create
        required: false
        options:
        - {label: 'Create the order only (you choose the courier in Shiprocket and press Ship)', value: create}
        - {label: 'Create the order, book the recommended courier, request pickup and make the label', value: full}
      - {label: Also send cash on delivery orders automatically, name: auto_cod, widget: boolean, default: true, required: false, hint: 'Switch off if you like to phone COD customers first.'}
      - {label: Update the order status automatically from Shiprocket tracking, name: auto_status, widget: boolean, default: false, required: false}
    - label: Delivery area rules (areas we do not deliver to, or charge extra for)
      name: area_rules
      widget: list
      required: false
      summary: '{{fields.name}} – {{fields.action}}'
      hint: Customers whose PIN code or address matches a "Block" rule cannot place an order. "Extra charge" areas pay the extra amount on top of the normal shipping fee.
      fields:
      - label: Area name (only for you)
        name: name
        widget: string
      - label: What should happen
        name: action
        widget: select
        options:
        - label: Block checkout
          value: block
        - label: Extra delivery charge
          value: extra_fee
        default: block
      - label: PIN codes or starts of PIN codes, separated by commas
        name: pins
        widget: string
        required: false
        hint: A full PIN such as 682555, or just the start to cover a whole region, such as 18 for Jammu and Kashmir or 744 for the Andaman Islands.
      - label: Place names to match in the city or address, separated by commas
        name: words
        widget: string
        required: false
        hint: Example – Leh, Kargil, Port Blair. The customer's city or address only needs to contain the name.
      - label: Extra delivery charge in ₹ (only for Extra delivery charge)
        name: extra_fee
        widget: number
        value_type: int
        min: 0
        required: false
      - label: Message shown to the customer
        name: message
        widget: text
        required: false
        hint: Leave empty to use a standard message.
    - label: Shipping fee (₹)
      name: shipping_fee
      widget: number
    - label: Free shipping above (₹)
      name: free_shipping_above
      widget: number
    - label: Bundle offers (Buy 2 / Buy 3 save %) – switch on to show them on every product that has bundle offers set
      name: bundles_enabled
      widget: boolean
      default: false
      required: false
      hint: Off = no bundle prices anywhere on the site. The bundle settings stay saved on each product, so switching this on brings them back exactly as they were.
    - label: Razorpay Key ID (paste later to switch on online payment, starts with rzp_)
      name: razorpay_key_id
      widget: string
      required: false
    - label: Cash on delivery option
      name: cod_enabled
      widget: boolean
      default: true
    - label: Fastest delivery time in days (used for the "Arrives" dates on the product page)
      name: delivery_days_min
      widget: number
      value_type: int
      min: 0
      default: 3
      required: false
    - label: Slowest delivery time in days
      name: delivery_days_max
      widget: number
      value_type: int
      min: 0
      default: 6
      required: false
    - label: Message shown to the customer right after they place an order
      name: order_thanks_message
      widget: string
      required: false
      default: Your order has been placed successfully.
    - label: Return window – days after delivery in which a customer can request a return (0 switches return requests off)
      name: return_window_days
      widget: number
      value_type: int
      min: 0
      default: 7
      required: false
      hint: Keep this the same as the number of days written in your Return & Refund Policy page.
    - label: Payment logos (upload the official logo images – Visa, Mastercard, RuPay, UPI etc.)
      name: payment_logos
      widget: list
      required: false
      fields:
      - label: Name
        name: name
        widget: string
      - label: Logo image
        name: image
        widget: image
