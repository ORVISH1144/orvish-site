name: Build product list
on:
  push:
    branches: [main]
    paths: ['data/products/**', 'data/commerce.json', 'product.html', 'tools/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild product list, product pages and sitemap
        run: python3 tools/build.py
      - name: Commit if changed
        run: |
          git config user.name "orvish-bot"
          git config user.email "bot@orvish.com"
          git add -A data/products.json sitemap.xml p index.html shop.html
          git diff --cached --quiet || (git commit -m "Rebuild product list and product pages" && git push)
      - name: Ask Pages to rebuild
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
        env:
          GH_TOKEN: ${{ github.token }}
