  icon: mail
- name: pages
  label: Pages & policies
  files:
  - name: pages
    label: About, Contact and policy pages
    file: data/pages.json
    format: json
    fields:
    - label: Pages
      name: pages
      widget: list
      summary: '{{fields.title}}'
      fields:
      - label: Slug (web address part)
        name: slug
        widget: string
      - label: Title
        name: title
        widget: string
      - label: Content
        name: body
        widget: markdown
  icon: description
