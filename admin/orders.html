<style>

.empty{opacity:.6;padding:20px}.login{max-width:420px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}.login input{width:100%;margin:6px 0}.err{color:#a11;min-height:20px;font-size:13px}

.docs{display:block;margin-top:6px}.docs a{color:inherit;font-weight:600}.docs .sup{color:#137333}#pd,#rg input{font:inherit;padding:8px 10px;border:1px solid #c9c2ad;border-radius:4px;background:#fff}#rg{display:inline-flex;gap:6px;align-items:center}#rg[hidden]{display:none}.cmps{display:grid;gap:14px}.cmp{background:#fff;border:1px solid #d9d2bd;border-radius:10px;padding:16px 18px}.cmp-h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.cmp p{margin:6px 0 2px}.cmp small{color:#5d6a66}

</style></head><body>
<header><h1>ORVISH · Orders</h1><span><a href="/admin/">Store admin</a> &nbsp;·&nbsp; <a href="/admin/traffic.html">Live traffic</a></span></header>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>
<script>
function t12(t){t=String(t||'').trim();var m=/^(?:(\d{4}-\d{2}-\d{2})\s+)?(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap]\.?m\.?)?$/i.exec(t);if(!m)return t;var h=+m[2],ap;if(m[4]){ap=m[4].replace(/\./g,'').toUpperCase();if(h===0)h=12}else{ap=h>=12?'PM':'AM';h=h%12||12}return(m[1]?m[1]+' ':'')+(h<10?'0':'')+h+':'+m[3]+' '+ap}
(function(){
if(/embed=1/.test(location.search))document.querySelector('header').classList.add('embed');
var $=function(s){return document.querySelector(s)},app=$('#app'),esc=function(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var load=function(u){return new Promise(function(ok,no){var s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})};
var auth,api='',orders=[],user=null,view='orders',stock={},srOn=false,titles={},STATUS=['New','Confirmed','Packed','Shipped','Out for delivery','Delivered','Cancelled','Return requested','Return approved','Returned','Refunded'],PAY=['COD','Pending','Paid','Paid (verified)','Failed','Refund pending','Partly refunded','Refunded'],retDays=0;
try{if(localStorage.getItem('orvish_notrack')===null)localStorage.setItem('orvish_notrack','true')}catch(e){}
fetch('/data/site.json?v='+Date.now()).then(function(r){return r.json()}).then(function(S){
  var c=S.firebase_config;api=S.order_webhook_url||'';
  if(!c||!c.apiKey||!api){app.innerHTML='<p class="empty">Orders cannot be shown until customer accounts (Firebase) and the order sheet link are set up.</p>';return}
  var b='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
  return load(b+'app-compat.js').then(function(){return load(b+'auth-compat.js')}).then(function(){firebase.initializeApp(c);auth=firebase.auth();auth.onAuthStateChanged(function(u){user=u;u?start():login()})})
}).catch(function(){app.innerHTML='<p class="err">Could not load. Please refresh.</p>'});
function login(){
  app.innerHTML='<div class="login"><h2 style="margin-top:0">Owner sign-in</h2><p>Sign in with the owner account to see your orders.</p><button class="p" id="g" style="width:100%">Continue with Google</button><div class="err" id="er"></div></div>';
  $('#g').onclick=function(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(x){$('#er').textContent=x.message||'Sign-in failed'})};
}
function call(params){return user.getIdToken().then(function(t){var q=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k])}).join('&');return fetch(api+'?'+q+'&token='+encodeURIComponent(t)+'&_='+Date.now())}).then(function(r){return r.json()})}
function start(){
  app.innerHTML='<div class="tabs"><button data-v="orders" class="on">Orders</button><button data-v="customers">Customers</button><button data-v="abandoned">Unfinished checkouts</button><button data-v="stock">Stock</button><button data-v="sales">Sales by month</button><button data-v="emails">Event emails</button></div><div class="bar"><input id="q" placeholder="Search name, phone, order ID, city or item"><select id="fs"><option value="">All statuses</option>'+STATUS.map(function(s){return'<option>'+s+'</option>'}).join('')+'</select><select id="pd" aria-label="Period"><option value="">All dates</option><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="tm">This month</option><option value="lm">Last month</option><option value="range">Choose dates…</option></select><span id="rg" hidden><input type="date" id="d1" aria-label="From"> to <input type="date" id="d2" aria-label="To"></span><button id="rf">Refresh</button><small>'+esc(user.email||'')+'</small><button id="out">Log out</button></div><div id="kp"></div><div id="list"><p class="empty">Loading orders…</p></div>';
  $('#out').onclick=function(){auth.signOut()};$('#rf').onclick=fetchOrders;$('#q').oninput=draw;$('#fs').onchange=draw;$('#pd').onchange=function(){$('#rg').hidden=$('#pd').value!=='range';draw()};$('#d1').onchange=draw;$('#d2').onchange=draw;fetchOrders();
  [].forEach.call(document.querySelectorAll('.tabs button'),function(b){b.onclick=function(){view=b.dataset.v;[].forEach.call(document.querySelectorAll('.tabs button'),function(x){x.classList.toggle('on',x===b)});$('#fs').style.display=view==='orders'?'':'none';$('#pd').style.display=view==='orders'||view==='sales'?'':'none';$('#rg').hidden=!(view==='orders'||view==='sales')||$('#pd').value!=='range';draw()}});
  fetch('/data/products.json?v='+Date.now()).then(function(r){return r.json()}).then(function(d){(d.products||[]).forEach(function(p){titles[p.id]=p.title})}).catch(function(){});
}
function fetchOrders(){
  $('#list').innerHTML='<p class="empty">Loading orders…</p>';
  call({action:'orders'}).then(function(d){
    if(!d||!d.ok){$('#list').innerHTML=d&&d.error==='not_authorised'?'<div class="tw"><p class="empty">You are signed in as <b>'+esc(user.email||'')+'</b>, which is not an owner email in the order script. Sign in with the owner Google account, or add this email to ADMIN_EMAILS in the script and deploy a new version.</p></div>':'<p class="err">Could not load orders. Make sure the newest script is deployed in your Google Sheet.</p>';return}
    orders=d.orders||[];retDays=Number(d.return_days)||0;stock=d.stock||{};srOn=!!d.shiprocket;draw();
  }).catch(function(){$('#list').innerHTML='<p class="err">Could not load orders. Make sure the newest script is deployed in your Google Sheet, then refresh.</p>'});
}
function num(v){return Number(String(v||'').replace(/[^0-9.]/g,''))||0}
function ph10(x){return String(x||'').replace(/\D/g,'').slice(-10)}
function refCode(phone){var t='orv'+ph10(phone),h=5381;for(var i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;return'ORV'+('00000'+h.toString(36).toUpperCase()).slice(-5)}
function liveO(o){return!/cancel|return|refund/i.test(o.order_status)&&!/^refunded/i.test(o.payment_status||'')}
function custs(){var by={},l=[];orders.slice().reverse().forEach(function(o){if(!liveO(o))return;var p=ph10(o.phone);if(!p)return;var c=by[p];if(!c){c=by[p]={phone:p,n:0,total:0,first:o.date,source:o.source||''};l.push(c)}c.n++;c.total+=num(o.total);c.name=o.name;c.email=o.email;c.city=o.city;c.last=o.date;c.items=o.items});return{by:by,list:l}}
var SUP={};fetch('/data/commerce.json?v='+Date.now()).then(function(r){return r.json()}).then(function(c){SUP=c.supplier||{};if(orders.length)draw()}).catch(function(){});
/* the message a supplier needs to pack and ship one order */
function supLink(o){var cod=/cod|cash/i.test((o.payment_status||'')+' '+(o.payment_method||'')),its=[];try{its=JSON.parse(o.items_json||'[]')}catch(e){}
  var lines=its.length?its.map(function(i){return'• '+i.qty+' x '+i.title}):String(o.items||'').split(/;\s*/).map(function(x){return'• '+x.replace(/\s*\((?:Rs\.?|₹)[^)]*\)\s*$/,'')});
  var t='*New ORVISH order to pack and ship*\nOrder: '+o.order_id+'\n\n*Items*\n'+lines.join('\n')+'\n\n*Deliver to*\n'+o.name+'\nPhone: '+o.phone+'\n'+String(o.address||'').replace(/\s*\(Map pin:[^)]*\)/,'')+'\n'+[o.city,o.pin].filter(Boolean).join(' - ')+(/^https:\/\/maps\.google\.com/.test(o.map||'')?'\nMap: '+o.map:'')+'\n\n*Payment*\n'+(cod?'Cash on delivery: collect ₹'+o.total:'Prepaid. Do not collect any money.')+'\n\n*Print the packing label (4 x 6 inch)*\n'+location.origin+'/packing?id='+encodeURIComponent(o.order_id)+'&ph='+ph10(o.phone);
  var n=String(SUP.whatsapp||'').replace(/\D/g,'');return'https://wa.me/'+n+'?text='+encodeURIComponent(t)}
function waLink(phone,text){return'https://wa.me/91'+ph10(phone)+'?text='+encodeURIComponent(text)}
function showOrdersOf(phone){view='orders';[].forEach.call(document.querySelectorAll('.tabs button'),function(x){x.classList.toggle('on',x.dataset.v==='orders')});$('#fs').style.display='';$('#fs').value='';$('#q').value=ph10(phone);draw();scrollTo(0,0)}
function drawCustomers(){
  var q=($('#q').value||'').toLowerCase(),c=custs().list.filter(function(x){return!q||[x.name,x.phone,x.email,x.city,x.items].join(' ').toLowerCase().indexOf(q)>-1}).sort(function(a,b){return b.n-a.n||b.total-a.total});
  var rp=c.filter(function(x){return x.n>1}).length;
  $('#kp').innerHTML='<div class="kpis"><div class="kpi"><small>Customers</small><b>'+c.length+'</b></div><div class="kpi"><small>Repeat customers (2 or more orders)</small><b>'+rp+'</b></div></div><p class="help">One row for each phone number, counting orders that were not cancelled or returned. Repeat customers are at the top with a gold mark. The same list is in the <b>Customers</b> tab of your Google Sheet.</p>';
  $('#list').innerHTML=c.length?'<div class="tw"><table><thead><tr><th>Customer</th><th>Orders</th><th>Total spent</th><th>First order</th><th>Last order</th><th>Last items</th><th>First came from</th><th>Referral code</th><th></th></tr></thead><tbody>'+c.map(function(x){return'<tr'+(x.n>1?' class="rp"':'')+'><td>'+esc(x.name)+(x.n>1?' <span class="rep">Repeat</span>':'')+'<small>'+esc(x.phone)+'</small><small>'+esc(x.email)+'</small><small>'+esc(x.city)+'</small></td><td class="n"><b>'+x.n+'</b></td><td class="n">₹'+x.total.toLocaleString('en-IN')+'</td><td>'+esc(x.first)+'</td><td>'+esc(x.last)+'</td><td>'+esc(x.items)+'</td><td class="src">'+esc(x.source||'—')+'</td><td><code>'+refCode(x.phone)+'</code></td><td><button class="lk ord" data-ph="'+esc(x.phone)+'">See orders</button><br><a class="wa" style="margin-top:6px" target="_blank" rel="noopener" href="'+waLink(x.phone,'Hi '+(x.name||'')+', this is ORVISH. ')+'">WhatsApp</a></td></tr>'}).join('')+'</tbody></table></div>':'<div class="tw"><p class="empty">No customers yet.</p></div>';
  [].forEach.call(document.querySelectorAll('button.ord'),function(b){b.onclick=function(){showOrdersOf(b.dataset.ph)}});
}
function drawAbandoned(){
  $('#kp').innerHTML='<p class="help">People who typed their phone or email at checkout (or were logged in with a filled cart) but did not order. Those with an email get the reminder email automatically. Use the WhatsApp button to send the same offer yourself.</p>';
  $('#list').innerHTML='<p class="empty">Loading…</p>';
  call({action:'abandoned'}).then(function(d){
    if(!d||!d.ok){$('#list').innerHTML='<p class="err">Could not load. Make sure script version 23 is deployed.</p>';return}
    var q=($('#q').value||'').toLowerCase(),r=(d.rows||[]).filter(function(x){return!q||[x.name,x.phone,x.email,x.items,x.status].join(' ').toLowerCase().indexOf(q)>-1});
    $('#list').innerHTML=r.length?'<div class="tw"><table><thead><tr><th>Date &amp; time (IST)</th><th>Customer</th><th>Cart</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>'+r.map(function(x){var st=x.status,cl=st==='Recovered'?' ok':st==='Open'?' warn':'';return'<tr><td>'+esc(x.date)+'<small>'+esc(t12(x.time))+'</small></td><td>'+esc(x.name||'—')+'<small>'+esc(x.phone)+'</small><small>'+esc(x.email)+'</small></td><td>'+esc(x.items)+'</td><td class="n">₹'+esc(x.total)+'</td><td><span class="pill'+cl+'">'+esc(st)+'</span>'+(x.reminded?'<small>Email sent '+esc(t12(x.reminded))+' IST</small>':'')+'</td><td>'+(x.phone&&st!=='Recovered'?'<a class="wa" target="_blank" rel="noopener" href="'+waLink(x.phone,'Hi '+(x.name||'')+', this is ORVISH. You left '+x.items+' in your cart.'+(d.code?' Use code '+d.code+' for an extra discount today: ':' Complete your order here: ')+'https://www.orvish.com/shop')+'">Send WhatsApp</a>':'')+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="tw"><p class="empty">No unfinished checkouts yet.</p></div>';
  }).catch(function(){$('#list').innerHTML='<p class="err">Could not load. Check your connection.</p>'});
}
/* Event emails: send a test copy straight away (the planned emails themselves go out by date, from the sheet) */
var CMPS=null;
function b64u(t){return btoa(unescape(encodeURIComponent(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function loadCmps(){
  /* the newest saved version comes straight from GitHub when the store admin is logged in, so a change can be tested at once */
  var tok='';try{var su=JSON.parse(localStorage.getItem('sveltia-cms.user')||'null');tok=su&&su.token||''}catch(e){}
  var gh=tok?fetch('https://api.github.com/repos/ORVISH1144/orvish-site/contents/data/emails.json?ref=main&_='+Date.now(),{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw+json'}}).then(function(r){if(!r.ok)throw 0;return r.json()}):Promise.reject();
  return gh.catch(function(){return fetch('/data/emails.json?_='+Date.now()).then(function(r){return r.json()})}).then(function(d){CMPS=(d&&d.campaigns)||[];return CMPS});
}
function drawEmails(){
  $('#kp').innerHTML='<p class="help">Edit the emails in the store admin: <b>Customer emails &gt; Event emails</b>, and press Save there. Then press <b>Send test now</b> here: the test arrives in a minute. When it looks right, tick <b>Ready to send</b> in the store admin. It goes out by itself at its date and time.</p>';
  if(!CMPS){$('#list').innerHTML='<p class="empty">Loading event emails…</p>';loadCmps().then(drawEmails).catch(function(){$('#list').innerHTML='<p class="err">Could not load the event emails.</p>'});return}
  if(!CMPS.length){$('#list').innerHTML='<p class="empty">No event emails yet. Add one in the store admin: Customer emails &gt; Event emails.</p>';return}
  $('#list').innerHTML='<div class="cmps">'+CMPS.map(function(c,i){return '<div class="cmp"><div class="cmp-h"><b>'+esc(c.name||c.subject)+'</b><span class="pill'+(c.send?' ok':'')+'">'+(c.send?'Ready to send':'Off – not sent yet')+'</span></div><p>'+esc(c.subject)+'</p><small>Sends on '+esc(c.date||'(no date)')+' India time · to '+esc({ordered:'customers who ordered',not_ordered:'people who have not ordered yet'}[c.audience]||'everyone')+'</small><div class="cmp-t"><input type="email" value="'+esc(c.test_email||user.email||'')+'" aria-label="Send the test to"><button class="go" data-i="'+i+'">Send test now</button></div><span class="note" id="ct'+i+'"></span></div>'}).join('')+'</div><p><button class="lk" id="cmp-re">Load the newest saved version</button></p>';
  $('#cmp-re').onclick=function(){CMPS=null;drawEmails()};
  [].forEach.call(document.querySelectorAll('.cmp .go'),function(b){b.onclick=function(){
    var i=Number(b.dataset.i),to=b.previousElementSibling.value.trim(),n=$('#ct'+i);b.disabled=true;n.textContent='Sending…';
    call({action:'cmp_test',to:to,c:b64u(JSON.stringify(CMPS[i]))}).then(function(d){b.disabled=false;n.textContent=d&&d.ok?'Sent to '+to+'. Check the inbox (and Promotions or Spam) in a minute.':'Not sent: '+((d&&d.error)||'please deploy the newest order script (version 46).')}).catch(function(){b.disabled=false;n.textContent='Could not reach the order script. Check your connection.'});
  }});
}
function drawStock(){
  var ids=Object.keys(stock);
  $('#kp').innerHTML='<p class="help">Type the number of bottles in the store admin: <b>Products &gt; open a product &gt; Stock count</b>. Every order lowers it. Cancelled and returned orders give the bottles back. Products without a count are not limited.</p>';
  $('#list').innerHTML=ids.length?'<div class="tw"><table style="min-width:0"><thead><tr><th>Product</th><th>Left</th></tr></thead><tbody>'+ids.sort(function(a,b){return stock[a]-stock[b]}).map(function(id){var n=Number(stock[id]);return'<tr><td>'+esc(titles[id]||id)+'</td><td class="n"><span class="pill'+(n<=0?' warn':n>5?' ok':'')+'">'+(n<0?'Oversold by '+(-n):n===0?'Sold out':n+' left')+'</span></td></tr>'}).join('')+'</tbody></table></div>':'<div class="tw"><p class="empty">No product has a stock count yet.</p></div>';
}
/* ---- dates (India time) and the period picked above the list ---- */
function ymd(o){var m=/(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(o&&o.date||''));if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);var d=new Date(o&&o.date);return isNaN(d)?'':d.toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'})}
function istDay(off){return new Date(Date.now()+(off||0)*86400000).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'})}
function period(){var v=$('#pd')?$('#pd').value:'',t=istDay(0),m=t.slice(0,7);
  if(!v)return null;if(v==='today')return[t,t,'Today'];if(v==='yesterday'){var y=istDay(-1);return[y,y,'Yesterday']}
  if(v==='7'||v==='30')return[istDay(1-Number(v)),t,'Last '+v+' days'];
  if(v==='tm')return[m+'-01',t,'This month'];
  if(v==='lm'){var d=new Date(Number(m.slice(0,4)),Number(m.slice(5,7))-2,1),lm=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);return[lm+'-01',lm+'-31','Last month']}
  if(v==='range'){var a=$('#d1').value,b=$('#d2').value;if(!a&&!b)return null;return[a||'0000-00-00',b||'9999-99-99',(a||'start')+' to '+(b||'today')]}
  return null}
function inPeriod(o){var p=period();if(!p)return true;var d=ymd(o);return!!d&&d>=p[0]&&d<=p[1]}
function bottles(o){var n=0;try{JSON.parse(o.items_json||'[]').forEach(function(i){n+=Number(i.qty)||0})}catch(e){}return n}
function drawSales(){
  var M={},list=orders.filter(inPeriod);
  list.forEach(function(o){var d=ymd(o);if(!d)return;var k=d.slice(0,7),r=M[k]=M[k]||{n:0,live:0,sales:0,qty:0,off:0,cod:0,online:0};r.n++;if(!liveO(o)){r.off++;return}r.live++;r.sales+=num(o.total);r.qty+=bottles(o);if(/cod|cash/i.test((o.payment_status||'')+' '+(o.payment_method||'')))r.cod+=num(o.total);else r.online+=num(o.total)});
  var ks=Object.keys(M).sort().reverse(),T={n:0,live:0,sales:0,qty:0,off:0,cod:0,online:0};ks.forEach(function(k){for(var x in T)T[x]+=M[k][x]});

  $('#list').innerHTML=ks.length?'<div class="tw"><table style="min-width:0"><thead><tr><th>Month</th><th>Sales</th><th>Orders</th><th>Average order</th><th>Bottles</th><th>Online</th><th>Cash on delivery</th><th>Cancelled / returned</th></tr></thead><tbody>'+ks.map(function(k){var r=M[k];return'<tr><td><button class="lk mth" data-m="'+k+'">'+mn(k)+'</button></td><td class="n"><b>'+rs(r.sales)+'</b></td><td class="n">'+r.live+'</td><td class="n">'+(r.live?rs(r.sales/r.live):'–')+'</td><td class="n">'+r.qty+'</td><td class="n">'+rs(r.online)+'</td><td class="n">'+rs(r.cod)+'</td><td class="n">'+r.off+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="tw"><p class="empty">No orders in this period.</p></div>';
  [].forEach.call(document.querySelectorAll('button.mth'),function(b){b.onclick=function(){var k=b.dataset.m;view='orders';[].forEach.call(document.querySelectorAll('.tabs button'),function(x){x.classList.toggle('on',x.dataset.v==='orders')});$('#fs').style.display='';$('#pd').value='range';$('#rg').hidden=false;$('#d1').value=k+'-01';$('#d2').value=k+'-31';draw();scrollTo(0,0)}});
}
function draw(){
  if(view==='sales')return drawSales();
  if(view==='emails')return drawEmails();
  if(view==='customers')return drawCustomers();if(view==='abandoned')return drawAbandoned();if(view==='stock')return drawStock();
  var q=($('#q').value||'').toLowerCase(),fs=$('#fs').value,cb=custs().by;
  var l=orders.filter(function(o){return inPeriod(o)&&(!fs||String(o.order_status).trim().toLowerCase()===fs.toLowerCase())&&(!q||[o.name,o.phone,o.order_id,o.city,o.items,o.email,o.tracking,o.coupon,o.payment_method,o.source].join(' ').toLowerCase().indexOf(q)>-1)});
  var live=orders.filter(function(o){return!/cancel|return|refund/i.test(o.order_status)}),today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
  var rets=orders.filter(function(o){return/^return requested$/i.test(String(o.order_status).trim())}).length;
  var k=function(a,b,c){return'<div class="kpi'+(c?' alert':'')+'"><small>'+a+'</small><b>'+b+'</b></div>'};
  $('#kp').innerHTML='<div class="kpis">'+k('Orders today',orders.filter(function(o){return o.date===today}).length)+k('To process (New / Confirmed / Packed)',orders.filter(function(o){return/^(new|confirmed|packed)$/i.test(String(o.order_status).trim())}).length)+k('Return requests to handle',rets,rets>0)+k('Total orders',orders.length)+k('Sales (not cancelled or returned)','₹'+live.reduce(function(a,o){return a+num(o.total)},0).toLocaleString('en-IN'))+(period()?k('Orders · '+esc(period()[2]),l.length)+k('Sales · '+esc(period()[2]),'₹'+l.filter(liveO).reduce(function(a,o){return a+num(o.total)},0).toLocaleString('en-IN')):'')+'</div><p class="help">Changing <b>Order status</b> emails the customer (only for the emails switched on under Customer emails in the store admin). Changing <b>Payment</b> does not send an email.'+(retDays>0?' Customers can request a return within '+retDays+' days of delivery.':' Customer return requests are switched off.')+'</p>';
  if(!l.length){$('#list').innerHTML='<div class="tw"><p class="empty">'+(orders.length?'No orders match this search.':'No orders yet.')+'</p></div>';return}
  $('#list').innerHTML='<div class="tw"><table><thead><tr><th>Date &amp; time (IST)</th><th>Order</th><th>Customer</th><th>Delivery address</th><th>Items</th><th>Total</th><th>Payment</th><th>Order status</th></tr></thead><tbody>'+l.map(function(o){
    var pay=String(o.payment_status||'').trim(),pc=/not verified|refund|fail/i.test(pay)?' warn':/paid/i.test(pay)?' ok':'',st=String(o.order_status||'').trim();
    var items;try{items=JSON.parse(o.items_json||'[]')}catch(e){items=[]}
    var thumbs=items.length?'<div class="thumbs">'+items.map(function(it){return'<img src="'+esc(it.image||'/images/perfume-1.svg')+'" alt="" title="'+esc((it.qty||1)+' x '+(it.title||''))+'">'}).join('')+'</div>':'';
    var opt=function(list,cur){return(list.map(function(x){return x.toLowerCase()}).indexOf(cur.toLowerCase())<0&&cur?'<option selected>'+esc(cur)+'</option>':'')+list.map(function(x){return'<option'+(x.toLowerCase()===cur.toLowerCase()?' selected':'')+'>'+x+'</option>'}).join('')};
    return'<tr'+((cb[ph10(o.phone)]||{}).n>1?' class="rp"':'')+'><td>'+esc(o.date)+'<small>'+esc(t12(o.time))+'</small></td><td><b>'+esc(o.order_id)+'</b><small>'+(o.tracking?'Tracking: '+esc(o.tracking)+' · ':'')+'<button class="lk trk" data-row="'+esc(o.row)+'">'+(o.tracking?'Edit':'Add courier tracking')+'</button></small>'+(o.source?'<small class="src">From: '+esc(o.source)+'</small>':'')+'<span class="sr">'+(srOn?(o.shiprocket_id?'<button class="srt" data-row="'+esc(o.row)+'">Shiprocket status</button> ':'')+(o.label?'<a href="'+esc(o.label)+'" target="_blank" rel="noopener">Print label</a>':(/^(new|confirmed|packed)$/i.test(st)?'<button class="src1" data-row="'+esc(o.row)+'">'+(o.shiprocket_id?'Get courier and label':'Ship with Shiprocket')+'</button>':'')):'')+'<span class="note" id="s'+esc(o.row)+'"></span></span><small class="docs"><a href="/invoice?id='+encodeURIComponent(o.order_id)+'&ph='+ph10(o.phone)+'" target="_blank" rel="noopener">Invoice</a> · <a href="/invoice?id='+encodeURIComponent(o.order_id)+'&ph='+ph10(o.phone)+'&print=1" target="_blank" rel="noopener">Download PDF</a> · <a href="/packing?id='+encodeURIComponent(o.order_id)+'&ph='+ph10(o.phone)+'&print=1" target="_blank" rel="noopener">Packing label</a> · <a class="sup" href="'+esc(supLink(o))+'" target="_blank" rel="noopener">WhatsApp to supplier</a></small></td><td>'+esc(o.name)+((cb[ph10(o.phone)]||{}).n>1?'<br><span class="rep" data-ph="'+esc(o.phone)+'" title="See all orders of this customer">Repeat · '+cb[ph10(o.phone)].n+' orders</span>':'')+'<small>'+esc(o.phone)+'</small><small>'+esc(o.email)+'</small></td><td>'+esc(o.address).replace(/\s*\(Map pin: (https:\/\/maps\.google\.com\/\?q=[-0-9.,]+)\)/,' <a href="$1" target="_blank" rel="noopener">Open map pin</a>')+(/^https:\/\/maps\.google\.com\/\?q=[-0-9.,]+$/.test(o.map||'')?' <a href="'+esc(o.map)+'" target="_blank" rel="noopener">Open map pin</a>':'')+'<small>'+esc([o.city,o.pin].filter(Boolean).join(' – '))+'</small></td><td>'+thumbs+esc(o.items)+'</td><td class="n">₹'+esc(o.total)+(o.coupon?'<small class="cpn">Coupon '+esc(o.coupon)+'</small>':'')+'</td><td><span class="pill'+pc+'">'+esc(pay||'—')+'</span>'+(o.payment_method?'<small class="pmth">'+esc(o.payment_method)+'</small>':'')+'<select class="pay" data-row="'+esc(o.row)+'" aria-label="Payment status">'+opt(PAY,pay)+'</select><span class="note" id="p'+esc(o.row)+'"></span></td><td><select class="os" data-row="'+esc(o.row)+'" aria-label="Order status">'+opt(STATUS,st)+'</select><span class="note" id="n'+esc(o.row)+'">'+(o.notified?'Last email: '+esc(o.notified):'')+'</span>'+(o.return_reason?'<span class="ret"><b>Return reason</b><br>'+esc(o.return_reason)+'</span>':'')+(o.delivered_on?'<span class="note">Delivered on '+esc(o.delivered_on)+'</span>':'')+'</td></tr>'}).join('')+'</tbody></table></div>';
  var byRow=function(row){return orders.filter(function(x){return String(x.row)===String(row)})[0]};
  [].forEach.call(document.querySelectorAll('span.rep[data-ph]'),function(b){b.onclick=function(){showOrdersOf(b.dataset.ph)}});
  [].forEach.call(document.querySelectorAll('button.src1'),function(b){b.onclick=function(){
    var o=byRow(b.dataset.row),note=$('#s'+b.dataset.row);
    if(!confirm('Send order '+o.order_id+' to Shiprocket?\n\nIt creates the shipment, asks for a courier and a pickup, and gets the label.'))return;

    call({action:'ship_create',row:o.row,order_id:o.order_id}).then(function(d){b.disabled=false;
      if(d&&d.shipment_id)o.shiprocket_id=d.shipment_id;if(d&&d.tracking)o.tracking=d.tracking;if(d&&d.label)o.label=d.label;
      var msg=((d&&d.steps)||[]).join(' · ')+(d&&d.error?' · '+d.error:'');if(d&&d.ok&&!d.error){draw();var n2=$('#s'+o.row);if(n2)n2.textContent=msg+' · Now set the status to Shipped when the courier collects it.'}else{note.textContent=msg||'Could not reach Shiprocket.'}
    }).catch(function(){b.disabled=false;note.textContent='Could not reach the order script. Check your connection.'});
  }});
  [].forEach.call(document.querySelectorAll('button.srt'),function(b){b.onclick=function(){
    var o=byRow(b.dataset.row),note=$('#s'+b.dataset.row);note.textContent='Checking…';
    call({action:'ship_track',row:o.row,order_id:o.order_id}).then(function(d){note.innerHTML=d&&d.ok?'Shiprocket: <b>'+esc(d.status||'no scan yet')+'</b>'+(d.where?' · '+esc(d.where):'')+(d.eta?' · expected '+esc(d.eta):'')+(d.url?' · <a href="'+esc(d.url)+'" target="_blank" rel="noopener">Open tracking</a>':''):esc((d&&d.error)||'No tracking yet.')}).catch(function(){note.textContent='Could not check.'});
  }});
  [].forEach.call(document.querySelectorAll('select.os'),function(s){s.onchange=function(){
    var o=byRow(s.dataset.row),val=s.value,note=$('#n'+s.dataset.row),old=o.order_status;
    if(!confirm('Change order '+o.order_id+' to "'+val+'"?\n\nThe customer gets an email about this status if that email is switched on and they gave an email address.')){s.value=old;return}
    s.disabled=true;note.textContent='Saving…';
    call({action:'set_status',row:o.row,order_id:o.order_id,status:val}).then(function(d){s.disabled=false;if(d&&d.ok){o.order_status=val;note.textContent='Saved · '+(d.notified||'');if(/refund/i.test(val)&&!/refund/i.test(o.payment_status||''))note.textContent+=' · Remember to set Payment to Refunded after you send the money back.'}else{s.value=old;note.textContent='Could not save. Refresh and try again.'}}).catch(function(){s.disabled=false;s.value=old;note.textContent='Could not save. Check your connection.'});
  }});
  [].forEach.call(document.querySelectorAll('select.pay'),function(s){s.onchange=function(){
    var o=byRow(s.dataset.row),val=s.value,note=$('#p'+s.dataset.row),old=o.payment_status;
    s.disabled=true;note.textContent='Saving…';
    call({action:'set_payment',row:o.row,order_id:o.order_id,status:val}).then(function(d){s.disabled=false;if(d&&d.ok){o.payment_status=val;draw()}else{s.value=old;note.textContent='Could not save. Make sure the newest script is deployed.'}}).catch(function(){s.disabled=false;s.value=old;note.textContent='Could not save. Check your connection.'});
  }});
  [].forEach.call(document.querySelectorAll('button.trk'),function(b){b.onclick=function(){
    var o=byRow(b.dataset.row),val=prompt('Courier name and tracking number for order '+o.order_id+'\n(shown to the customer on the tracking page and in the shipped email)',o.tracking||'');
    if(val===null)return;b.disabled=true;b.textContent='Saving…';
    call({action:'set_tracking',row:o.row,order_id:o.order_id,tracking:val.trim()}).then(function(d){if(d&&d.ok){o.tracking=val.trim()}draw()}).catch(function(){draw()});
  }});
}
